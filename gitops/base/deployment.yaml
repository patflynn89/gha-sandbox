apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopcart
  labels:
    app: shopcart
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shopcart
  template:
    metadata:
      labels:
        app: shopcart
    spec:
      containers:
        - name: shopcart
          image: shopcart            # rewritten by kustomization.yaml "images:"
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }

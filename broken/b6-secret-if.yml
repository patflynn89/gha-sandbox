# SYMPTOM: Workflow is rejected / the step never runs, even though SLACK_WEBHOOK is set.
name: B6 - secret in if

on: [push]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Notify
        if: secrets.SLACK_WEBHOOK != ''
        run: curl -X POST -d '{"text":"build done"}' "${{ secrets.SLACK_WEBHOOK }}"

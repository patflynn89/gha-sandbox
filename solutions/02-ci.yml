name: 02 - CI

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/02-ci.yml"]
  pull_request:
    paths: ["app/**", ".github/workflows/02-ci.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -v

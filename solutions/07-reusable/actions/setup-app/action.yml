# Composite action -> place at .github/actions/setup-app/action.yml
# Jenkins analogue: a shared-library step (vars/setupApp.groovy)
name: Setup app
description: Install Python and the app's dev dependencies
inputs:
  python-version:
    description: Python version
    default: "3.13"
outputs:
  python-path:
    description: Path to the python interpreter
    value: ${{ steps.py.outputs.python-path }}
runs:
  using: composite
  steps:
    - id: py
      uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
        cache-dependency-path: app/pyproject.toml
    - shell: bash
      run: pip install -e "app[dev]"

name: 04 - Cache & Artifacts

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: app/pyproject.toml

      - run: pip install -e ".[dev]"

      - name: Test with JUnit report
        run: pytest --junitxml=reports/junit.xml

      - name: Upload test report
        if: always()            # upload even when tests fail - that's when you need it!
        uses: actions/upload-artifact@v7
        with:
          name: junit-report
          path: app/reports/junit.xml
          retention-days: 7

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Build wheel
        working-directory: app
        run: |
          pip install build
          python -m build --wheel --outdir dist/
      - uses: actions/upload-artifact@v7
        with:
          name: wheel
          path: app/dist/*.whl

  smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v8
        with:
          name: wheel
          path: dist
      - name: Install wheel and import it
        run: |
          pip install dist/*.whl
          python -c "from shopcart import Cart; print('total:', Cart().total_cents())"

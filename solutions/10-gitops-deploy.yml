name: 10 - GitOps (build, then bump manifest)

on:
  push:
    branches: [main]
    paths: ["app/**"]          # NOT gitops/** - otherwise the bump commit would retrigger us
  workflow_dispatch:

permissions:
  contents: write      # push the manifest bump
  packages: write      # push the image

concurrency:
  group: gitops-deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/shopcart

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - id: tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: app
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
          build-args: APP_VERSION=${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The pipeline never touches the cluster. It only changes Git.
  # Argo CD notices the commit and syncs the cluster. That's GitOps.
  bump-manifest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Update image tag in kustomization
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          cd gitops/base
          sed -i "s|newTag: .*|newTag: ${TAG}|" kustomization.yaml
          sed -i "s|newName: .*|newName: ${IMAGE}|" kustomization.yaml
          git diff
      - name: Commit & push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy: shopcart ${{ needs.build.outputs.tag }}"
          git push

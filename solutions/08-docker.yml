name: 08 - Docker build & push to GHCR

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/08-docker.yml"]
  pull_request:
    paths: ["app/**"]

permissions:
  contents: read
  packages: write        # needed to push to ghcr.io with GITHUB_TOKEN

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/shopcart

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'   # PRs from forks have no write token
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=short
            type=ref,event=branch
            type=ref,event=pr

      - name: Build (and push on main)
        uses: docker/build-push-action@v7
        with:
          context: app
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

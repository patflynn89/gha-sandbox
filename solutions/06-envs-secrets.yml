name: 06 - Environments, secrets & conditions

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Where to deploy
        type: choice
        options: [staging, production]
        default: staging
      dry_run:
        type: boolean
        default: true

# Least privilege by default - jobs can widen it.
permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_NAME: shopcart          # workflow-level env

jobs:
  deploy-staging:
    if: github.event_name == 'push' || inputs.target == 'staging'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.example.com
    steps:
      - name: Deploy
        env:
          API_TOKEN: ${{ secrets.DEPLOY_TOKEN }}   # environment secret
          REGION: ${{ vars.REGION }}               # environment variable (non-secret)
        run: |
          if [ -z "$API_TOKEN" ]; then
            echo "::warning::DEPLOY_TOKEN not set - did you create the 'staging' environment secret?"
          fi
          echo "Deploying $APP_NAME to staging in region ${REGION:-unset}"
          echo "Token is masked in logs: $API_TOKEN"

  deploy-production:
    # Only via manual run, and only from main.
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'production' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production          # add "Required reviewers" in repo settings -> manual approval gate
      url: https://example.com
    steps:
      - name: Deploy
        env:
          API_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "DRY RUN - would deploy $APP_NAME to production"
          else
            echo "Deploying $APP_NAME to production"
          fi

  notify-on-failure:
    needs: [deploy-staging, deploy-production]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - run: echo "::error::A deployment failed on ${{ github.ref_name }}"

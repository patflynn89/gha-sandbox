name: Lint workflows

# NOTE: deliberately NOT filtered with `paths:`.
# A *required* status check that gets skipped by a path filter never reports a
# result, so every PR that does not touch a workflow stays stuck on
# "Expected — Waiting for status to be reported" and can never merge.
# actionlint runs in ~10s, so we simply always run it.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: this job only reads the repository.
permissions:
  contents: read

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR branch).
concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ACTIONLINT_VERSION: "1.7.12"

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Pinned to a commit SHA, not a mutable tag. A tag can be re-pointed at
      # new code by whoever controls the action repo; a SHA cannot.
      # Keep it fresh with Dependabot (`package-ecosystem: github-actions`).
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The token would otherwise stay in .git/config for the whole job.
          persist-credentials: false

      # The installer script is pinned to the release tag, not `main`.
      - name: Install actionlint
        run: |
          SCRIPT="https://raw.githubusercontent.com/rhysd/actionlint"
          SCRIPT+="/v${ACTIONLINT_VERSION}/scripts/download-actionlint.bash"
          bash <(curl -sSfL "$SCRIPT") "$ACTIONLINT_VERSION"
          ./actionlint --version

      # shellcheck and pyflakes are preinstalled on GitHub runners, so
      # actionlint picks them up and also checks your `run:` blocks.
      - name: Lint
        run: ./actionlint -color -oneline

      - name: Write job summary
        if: always()
        shell: bash
        run: |
          {
            echo "### actionlint \`$ACTIONLINT_VERSION\`"
            echo
            echo "| workflow file |"
            echo "| --- |"
            find .github/workflows -type f \
              \( -name '*.yml' -o -name '*.yaml' \) \
              -print0 |
              sort -z |
              while IFS= read -r -d '' file; do
                echo "| \`$file\` |"
              done
          } >> "$GITHUB_STEP_SUMMARY"
